name: Create Kubernetes Secret from GitHub Secrets

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      k8s_secret_name:
        required: true
        type: string
      k8s_namespace:
        required: true
        type: string
      aks_resource_group:
        required: true
        type: string
      aks_cluster_name:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      SECRETS_CONTEXT:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  create-k8s-secret:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ inputs.aks_resource_group }} \
            --name ${{ inputs.aks_cluster_name }} \
            --overwrite-existing

      - name: Create Kubernetes secret from GitHub secrets
        env:
          SECRETS_CONTEXT: ${{ secrets.SECRETS_CONTEXT }}
          K8S_SECRET_NAME: ${{ inputs.k8s_secret_name }}
          K8S_NAMESPACE: ${{ inputs.k8s_namespace }}
        run: |
          TMPDIR=$(mktemp -d)
          trap "rm -rf $TMPDIR" EXIT

          # Write each secret value to a file named after its key.
          # --from-file=DIR/ handles newlines and special characters safely
          # (e.g. Firebase private key) without any manual base64 or escaping.
          while IFS= read -r key; do
            if [[ "$key" == "AZURE_CLIENT_ID"       || \
                  "$key" == "AZURE_TENANT_ID"        || \
                  "$key" == "AZURE_SUBSCRIPTION_ID"  || \
                  "$key" == "github_token"            || \
                  "$key" == "PACKAGE_TOKEN"           || \
                  "$key" == "SECRETS_CONTEXT" ]]; then
              echo "Skipping infrastructure secret: $key"
              continue
            fi
            printf '%s' "$(echo "$SECRETS_CONTEXT" | jq -r --arg k "$key" '.[$k]')" \
              > "${TMPDIR}/${key}"
          done < <(echo "$SECRETS_CONTEXT" | jq -r 'keys[]')

          echo "Keys written to secret $K8S_SECRET_NAME:"
          ls "$TMPDIR"

          kubectl delete secret "$K8S_SECRET_NAME" \
            --namespace "$K8S_NAMESPACE" \
            --ignore-not-found=true

          kubectl create secret generic "$K8S_SECRET_NAME" \
            --namespace "$K8S_NAMESPACE" \
            --from-file="$TMPDIR/"

          echo "Secret $K8S_SECRET_NAME created successfully in namespace $K8S_NAMESPACE."
